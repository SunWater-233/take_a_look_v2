name: Desktop build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-test:
    name: Python backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run backend tests
        run: python -m pytest -q backend

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
          - name: macOS
            os: macos-latest
            target: macos
          - name: Linux
            os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libusb-1.0-0-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.target }} --debug
