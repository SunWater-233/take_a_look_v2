name: take_a_look_v2
description: "Take A Look embedded tuning workstation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  desktop_drop: ^0.8.4
  desktop_multi_window: ^0.3.0
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  tal_drag_preview:
    path: plugins/tal_drag_preview
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - backend/pyproject.toml
    - backend/take_a_look_backend/
    - backend/runtime/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/MiSans-Bold.otf
          weight: 700
    - family: Ibrand
      fonts:
        - asset: assets/fonts/Ibrand.otf
          weight: 700
