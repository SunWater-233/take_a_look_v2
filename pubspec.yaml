name: take_a_look_v2
description: "Take A Look embedded tuning workstation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  desktop_multi_window: ^0.3.0
  flutter:
    sdk: flutter
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/MiSans-Bold.otf
          weight: 700
    - family: Ibrand
      fonts:
        - asset: assets/fonts/Ibrand.otf
          weight: 700
